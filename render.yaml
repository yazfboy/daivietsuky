# Render Blueprint — backend Đại Việt Sử Ký (FastAPI + WebSocket). CHƯA deploy; dùng khi nhóm duyệt xong.
# Cách dùng:
#   1. https://dashboard.render.com → New → Blueprint → chọn repo yazfboy/daivietsuky.
#   2. Ở mục Environment, khai báo các biến dưới đây (giá trị nhập tay trên dashboard, KHÔNG ghi vào file / Git).
#   3. Deploy xong có URL dạng https://daivietsuky-backend.onrender.com — trùng với VITE_API_BASE_URL trong
#      frontend/.env.production. Nếu Render cấp URL khác, sửa file đó (hoặc đặt biến VITE_API_BASE_URL trong
#      repo → Settings → Secrets and variables → Actions → Variables) rồi build lại frontend.
#   4. Trước buổi demo, mở https://<url>/health để đánh thức server (gói free ngủ sau ~15 phút không dùng).
#
# Biến môi trường cần khai báo (chỉ TÊN, không ghi giá trị):
#   - GEMINI_API_KEYS   : 5 key Google AI Studio, phân tách bằng dấu phẩy (bí mật).
#     (hoặc thay bằng GEMINI_KEY_1 … GEMINI_KEY_5)
# Render tự đặt biến RENDER=true → backend chỉ nhận CORS / WebSocket từ https://yazfboy.github.io.
# Phiên bản Python lấy từ file .python-version ở gốc repo.
services:
  - type: web
    name: daivietsuky-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
