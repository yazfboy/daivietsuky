name: Deploy frontend to GitHub Pages

# Mỗi lần đẩy lên main (hoặc chạy tay) sẽ build frontend và publish lên nhánh gh-pages,
# từ đó GitHub Pages phục vụ https://yazfboy.github.io/daivietsuky/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Thư viện video minh họa: loại mục thiếu reviewed_by / có mặt nhân vật / thiếu .mp4 / còn âm thanh,
      # rồi sinh frontend/public/assets/videos/approved.json — frontend chỉ hiện nút "Xem video" cho key có trong file này.
      - name: Check video library
        run: python scripts/check_video_library.py

      - name: Build (base /daivietsuky/)
        working-directory: frontend
        env:
          VITE_BASE: /daivietsuky/
          # Địa chỉ backend mặc định nằm trong frontend/.env.production (URL Render). Muốn đổi thì đặt biến
          # repo → Settings → Secrets and variables → Actions → Variables → VITE_API_BASE_URL.
          API_BASE_OVERRIDE: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_OVERRIDE" ]; then export VITE_API_BASE_URL="$API_BASE_OVERRIDE"; fi
          npm run build

      # Gỡ khỏi bản build mọi file video không có mục duyệt hợp lệ (không đăng clip chưa duyệt lên gh-pages).
      - name: Remove unapproved videos from build
        run: python scripts/check_video_library.py --dist frontend/dist

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          force_orphan: true
